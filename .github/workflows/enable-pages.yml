name: Enable GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enable-pages.yml'

jobs:
  enable:
    if: github.event.head_commit.message != 'Remove Pages enable workflow'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable Pages from main root and set homepage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          AUTH=( -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" )
          echo "POST /pages"
          code=$(curl -sS -o /tmp/pages-post.json -w "%{http_code}" -X POST "${AUTH[@]}" \
            "https://api.github.com/repos/${REPO}/pages" \
            -d '{"build_type":"legacy","source":{"branch":"main","path":"/"}}')
          echo "POST status $code"
          cat /tmp/pages-post.json
          echo
          if [ "$code" = "409" ]; then
            echo "Pages already exists; putting source"
            code=$(curl -sS -o /tmp/pages-put.json -w "%{http_code}" -X PUT "${AUTH[@]}" \
              "https://api.github.com/repos/${REPO}/pages" \
              -d '{"build_type":"legacy","source":{"branch":"main","path":"/"}}')
            echo "PUT status $code"
            cat /tmp/pages-put.json
            echo
          fi
          echo "PATCH repo homepage"
          code=$(curl -sS -o /tmp/repo-patch.json -w "%{http_code}" -X PATCH "${AUTH[@]}" \
            "https://api.github.com/repos/${REPO}" \
            -d '{"homepage":"https://cramli83.github.io/square-compass-lodge3/"}')
          echo "PATCH status $code"
          cat /tmp/repo-patch.json
          echo
          echo "GET /pages"
          curl -sS "${AUTH[@]}" "https://api.github.com/repos/${REPO}/pages" || true
          echo
      - name: Remove this one-shot workflow
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/enable-pages.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add -A
          git commit -m "Remove Pages enable workflow"
          git push
