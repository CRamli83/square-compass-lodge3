name: Materialize site assets

on:
  push:
    branches: [main]
    paths:
      - 'assets-b64.json'
      - '.github/workflows/materialize-assets.yml'

jobs:
  decode:
    if: github.event.head_commit.message != 'Add decoded site images'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Decode binaries, commit, and remove staging files
        run: |
          set -euo pipefail
          test -f assets-b64.json
          python3 << 'PY'
          import base64, json, sys
          from pathlib import Path
          manifest = json.loads(Path("assets-b64.json").read_text())
          expected = {
              "logo.png": b"\x89PNG\r\n\x1a\n",
              "favicon-32.png": b"\x89PNG\r\n\x1a\n",
              "apple-touch-icon.png": b"\x89PNG\r\n\x1a\n",
              "og-image.png": b"\x89PNG\r\n\x1a\n",
              "favicon.ico": b"\x00\x00\x01\x00",
          }
          if set(manifest) != set(expected):
              sys.exit(f"unexpected manifest keys: {sorted(manifest)}")
          for name, prefix in expected.items():
              data = base64.b64decode(manifest[name])
              if not data.startswith(prefix):
                  sys.exit(f"{name} failed signature check")
              Path(name).write_bytes(data)
              print(f"wrote {name} ({len(data)} bytes)")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logo.png favicon.ico favicon-32.png apple-touch-icon.png og-image.png
          git rm -f assets-b64.json .github/workflows/materialize-assets.yml
          # drop the now-empty workflows dir if it is empty
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add -A
          git status
          git commit -m "Add decoded site images"
          git push
